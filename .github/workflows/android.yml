name: Android build

# Every push to main builds the app for Android.
# With the four ANDROID_* signing secrets set (see README, "Android builds"),
# it builds a signed release bundle (.aab) ready for Play Console.
# Without them it builds a debug APK, which proves the app compiles but is not
# for Play.
# With the PLAY_SERVICE_ACCOUNT_JSON secret also set (see README, "Play upload"),
# the signed bundle is uploaded to Play's closed testing track as a DRAFT
# release. Nothing reaches testers until someone rolls it out in Play Console.
#
# Nothing goes to Play unless the device-e2e job passes first: it turns that
# exact bundle into the APK a phone downloads, installs it on an emulator
# (a phone on API 34 and a Pixel Fold on API 35), launches it, walks a real
# first session (sideways, folded and unfolded, Settings, export), reopens the
# app and checks logcat for crashes and ANRs (tool/device_e2e.py); then runs
# the app's own end-to-end tests on the same emulator (tool/device_suite.sh).
# Added Nov 13 after Wagebird v11 and Wrenchnote v10 crashed on launch.

on:
  push:
    # gate/* branches run the build and the emulator check without uploading.
    branches: [main, 'gate/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.meta.outputs.signed }}
    env:
      APP_DIR: apps/hours_tracker
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # AdMob ids (studioswiddle@gmail.com's AdMob) are public: they ship inside
      # every copy of the app. Repo variables of the same names override them.
      # Empty ids make a release build fall back to Google's test ads.
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-4772684050013957~7009892675' }}
      ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID || 'ca-app-pub-4772684050013957/9249043205' }}
      PLAY_PACKAGE: com.shuklamrajat.wagebird
      PLAY_LISTING: store/hours_tracker/listing.md
    steps:
      - name: Signed build?
        id: meta
        run: echo "signed=$HAS_UPLOAD_KEY" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check the Play upload script against a fake Play server
        run: |
          python3 -m pip install --quiet google-auth requests cryptography
          python3 tool/play_upload_e2e.py --listing "$PLAY_LISTING" --package "$PLAY_PACKAGE"

      - name: Keep the Play upload check record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-upload-check-${{ github.run_number }}
          path: tool/test-output/play_upload_e2e.json
          if-no-files-found: ignore

      - name: Write signing config from secrets
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$APP_DIR/android/key.properties"

      - name: Check the AdMob ids are set
        run: |
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_ID" ]; then
            echo "::warning::An AdMob id is empty, so this build shows Google's test ads and earns nothing."
          else
            echo "AdMob app $ADMOB_APP_ID, banner $ADMOB_BANNER_ID"
          fi

      - name: Build signed release bundle (.aab)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: ${{ env.APP_DIR }}
        # The run number is the version code, so every upload is newer than the last.
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=ADMOB_BANNER_ID="$ADMOB_BANNER_ID"

      - name: Check the bundle is signed with the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          cert=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$cert" | grep -E 'Owner:|SHA256:'
          if echo "$cert" | grep -q 'CN=Android Debug'; then
            echo "::error::The bundle is signed with the debug key, which Play rejects."
            exit 1
          fi

      - name: Check the bundle is set up for AdMob
        # Play's Advertising ID declaration says the apps use one (AdMob), so
        # the permission must be in the final manifest, along with this app's
        # AdMob app id, and the release code must carry the real banner unit.
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/manifest.pb"
          echo "Permissions in the merged manifest:"
          grep -aoE '[A-Za-z0-9_.]+[.]permission[.][A-Z0-9_]+' "$RUNNER_TEMP/manifest.pb" | sort -u || echo "(none)"
          grep -aq 'permission.AD_ID' "$RUNNER_TEMP/manifest.pb" || { echo "::error::No advertising ID permission, but Play is told the app uses one."; exit 1; }
          echo "Advertising ID permission present."
          if [ -n "$ADMOB_APP_ID" ]; then
            grep -aqF "$ADMOB_APP_ID" "$RUNNER_TEMP/manifest.pb" || { echo "::error::The manifest doesn't carry AdMob app id $ADMOB_APP_ID."; exit 1; }
            unzip -p "$aab" base/lib/arm64-v8a/libapp.so | grep -aqF "$ADMOB_BANNER_ID" || { echo "::error::The release code doesn't carry banner unit $ADMOB_BANNER_ID."; exit 1; }
            echo "Real AdMob app id and banner unit are in the bundle."
          fi

      - name: Upload release bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wagebird-release-aab-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build debug APK (no signing secrets set)
        if: env.HAS_UPLOAD_KEY != 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "::notice::No signing secrets, so this run builds a debug APK, not a Play bundle."
          flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload debug APK
        if: env.HAS_UPLOAD_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wagebird-debug-apk-not-for-play-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" "$APP_DIR/android/key.properties"

  device-e2e:
    name: Release build on ${{ matrix.device }} (API ${{ matrix.api }})
    needs: android
    if: needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write   # only to push screenshots to the emulator-proof branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: pixel_6
            api: 34
          - device: pixel_fold
            api: 35
    env:
      APP_DIR: apps/hours_tracker
      PLAY_PACKAGE: com.shuklamrajat.wagebird
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wagebird-release-aab-${{ github.run_number }}
          path: bundle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: The APK a phone gets from this bundle
        # bundletool builds it the way Play does. It is signed with a throwaway
        # key: the code inside is byte for byte what Play serves.
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass android -keypass android -alias t \
            -keyalg RSA -dname CN=device-e2e -validity 2 >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=bundle/app-release.aab --output="$RUNNER_TEMP/app.apks" \
            --mode=universal --ks="$RUNNER_TEMP/throwaway.jks" --ks-pass=pass:android --ks-key-alias=t --key-pass=pass:android
          unzip -o -q "$RUNNER_TEMP/app.apks" universal.apk
          ls -la universal.apk

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and use it on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device }}
          disable-animations: true   # the app's own tests; the release session turns them back on
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/device_suite.sh universal.apk "$PLAY_PACKAGE" "$APP_DIR" "device-e2e/${{ matrix.device }}" "${{ matrix.device }} API ${{ matrix.api }}"

      - name: Pass/fail report
        if: always()
        run: |
          cat "device-e2e/${{ matrix.device }}/summary.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "No summary - the emulator step stopped before writing one." >> "$GITHUB_STEP_SUMMARY"

      - name: Save the screenshots and results to the emulator-proof branch
        if: always()
        env:
          RUN: run-${{ github.run_number }}
          DEVICE: ${{ matrix.device }}
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          src="device-e2e/$DEVICE"
          [ -d "$src" ] || { echo "nothing to save"; exit 0; }
          dest=$(mktemp -d)
          if ! git clone -q --depth 1 --branch emulator-proof "$REMOTE" "$dest" 2>/dev/null; then
            git init -q "$dest"
            git -C "$dest" checkout -q --orphan emulator-proof
            git -C "$dest" remote add origin "$REMOTE"
          fi
          d="$dest/$RUN/$DEVICE"
          mkdir -p "$d"
          cp "$src"/release/*.png "$src"/release/result.json "$d"/ 2>/dev/null || true
          cp "$src"/summary.txt "$d"/ 2>/dev/null || true
          grep -E "FATAL EXCEPTION|Fatal signal|ANR in" "$src"/release/logcat.txt > "$d/logcat-crashes.txt" 2>/dev/null || true
          tail -n 80 "$src"/integration.log > "$d/integration-tail.txt" 2>/dev/null || true
          git -C "$dest" add -A
          git -C "$dest" -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Emulator proof $RUN $DEVICE"
          for i in 1 2 3 4 5; do
            git -C "$dest" pull -q --rebase origin emulator-proof 2>/dev/null || true
            git -C "$dest" push -q origin HEAD:emulator-proof && exit 0
            sleep $((i * 5))
          done
          echo "::warning::could not push the screenshots"

      - name: Keep the screenshots, logcat and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-e2e-${{ matrix.device }}-${{ github.run_number }}
          path: device-e2e/
          if-no-files-found: warn

  play:
    name: Upload to Play closed testing (draft)
    needs: [android, device-e2e]
    if: needs.android.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      PLAY_PACKAGE: com.shuklamrajat.wagebird
      PLAY_LISTING: store/hours_tracker/listing.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wagebird-release-aab-${{ github.run_number }}
          path: bundle

      - name: Upload to Play closed testing as a draft
        if: env.HAS_PLAY_KEY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet google-auth requests cryptography
          python3 tool/play_upload.py --package "$PLAY_PACKAGE" --listing "$PLAY_LISTING" \
            --aab bundle/app-release.aab --track alpha

      - name: Play upload skipped (no PLAY_SERVICE_ACCOUNT_JSON secret)
        if: env.HAS_PLAY_KEY != 'true'
        run: echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, so the bundle was not sent to Play. See README, Play upload."
