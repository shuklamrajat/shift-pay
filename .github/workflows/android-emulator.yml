name: Android emulator E2E

# Runs every end-to-end journey on a real Android system (an x86_64 emulator
# with Google APIs): real SQLite files, the real consent (UMP) and AdMob
# plugins with Google's test ads, the back button and an app restart.
# Artifacts: checks (result.json per suite), exported files, in-app
# screenshots and a screen recording of the whole run.

on:
  push:
    branches: [e2e/emulator]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_DIR: apps/hours_tracker
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run the journeys on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ env.APP_DIR }}
          script: bash tool/run_emulator_e2e.sh

      - name: Keep the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-e2e-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/test-artifacts/emulator
          if-no-files-found: warn
